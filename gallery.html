    <style>
        .evidence-gallery {
            max-width: 1150px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 25px;
        }

        .evidence-gallery img {
            display: block;
            width: 100%;
            height: 320px;
            object-fit: contain;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        @media (max-width: 650px) {
            .evidence-gallery {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .evidence-gallery img {
                height: auto;
                max-height: 350px;
            }
        }
    </style>
</head>
